# CPU-limited local embedding service. It has no published host port; only the
# web and MCP containers join its dedicated Docker network.
services:
  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_CONTEXT_LENGTH: "2048"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      local-embeddings:
        aliases:
          - ollama
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  local-embeddings:
    external: true
    name: discourselens-local-embeddings

volumes:
  ollama-models:
    external: true
    name: discourselens-ollama-models
